# Offensive Scanner Configuration

# General settings
general:
  timeout: 30  # Default timeout in seconds
  threads: 10  # Default number of threads
  verbose: false
  debug: false
  user_agent: "Offensive-Scanner/1.0"
  output_dir: "./reports"
  database_path: "./database/scans.db"

# Port scanning settings
port_scan:
  default_ports: "21,22,23,25,53,80,110,111,135,139,143,443,445,993,995,1723,3306,3389,5900,8080"
  scan_type: "SYN"  # Options: SYN, CONNECT, UDP
  timeout: 5
  threads: 50
  min_rate: 100
  max_retries: 3

# Service enumeration settings
service_enum:
  aggressive: false
  scripts: "default,banner,version"
  timeout: 10

# Web scanning settings
web_scan:
  crawl_depth: 3
  timeout: 30
  threads: 5
  forms: true
  cookies: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
  headers:
    Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
    Accept-Language: "en-US,en;q=0.5"
  checks:
    xss: true
    sqli: true
    lfi: true
    rfi: true
    csrf: true
    open_redirect: true
    ssrf: true

# Brute force settings
brute_force:
  services:
    - ssh
    - ftp
    - telnet
    - smb
    - rdp
    - mysql
  default_wordlist: "./wordlists/passwords.txt"
  timeout: 10
  max_attempts: 100
  delay: 1  # Seconds between attempts

# DNS enumeration settings
dns_enum:
  wordlist: "./wordlists/subdomains.txt"
  record_types:
    - A
    - AAAA
    - CNAME
    - MX
    - NS
    - TXT
    - SOA
  threads: 20
  timeout: 5

# Vulnerability scanning
vuln_scan:
  cve_database: "./database/cve.db"
  auto_update: true
  scan_level: "medium"  # Options: light, medium, aggressive
  timeout: 60
  threads: 5

# Reporting settings
reporting:
  formats:
    - html
    - json
    - pdf
    - xml
  include_screenshots: true
  risk_levels:
    - critical
    - high
    - medium
    - low
    - info

# Exploitation settings
exploitation:
  enabled: false  # Disabled by default for safety
  auto_exploit: false
  safe_checks: true
  timeout: 60

# Proxy settings
proxy:
  enabled: false
  type: "socks5"  # Options: http, https, socks4, socks5
  host: "127.0.0.1"
  port: 9050
  username: ""
  password: "" 